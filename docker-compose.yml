# Default storage substrate per ADR-008 (Apache-2.0, actively maintained).
# Override via: docker compose -f docker-compose.minio.yml up
# Docs: https://github.com/seaweedfs/seaweedfs
# Status: STUB — ADR-008 implementation work fleshes out post-acceptance.
version: "3.8"
services:
  storage:
    image: chrislusf/seaweedfs:4.23  # Apache-2.0, pushed 2025-05-04, sha256:c6d6fb84b081f1f09bb089184ff4b45d2f163a1bfa8b354d04cf400c6e06f242 (verified by Worker B 2026-05-13)
    command: server -s3 -dir=/data -s3.port=9000
    ports:
      - "9000:9000"
    volumes:
      - ./.nucleus/storage:/data
    restart: unless-stopped
# NEEDS VERIFICATION: SeaweedFS S3 API parity edge cases (signature v4, path-style addressing, multipart chunk threshold) — PoC #4 measures pre-ADR-008 acceptance per ADR-008 §Verification plan.
