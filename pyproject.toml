# ============================================================================
# Nucleus — Python project configuration
# ============================================================================
# Per AGENTS.md Hard Constraint #11: all runtime dependencies use EXACT pins.
# Per AGENTS.md Hard Constraint #10: every wrapped library has docs reference.
# Version updates: ONE component per PR; smoke tests required; rollback documented.
# See docs/internal/compatibility.md for current tested versions.
# ============================================================================

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nucleus-data"
version = "0.2.0"  # Tier 2 "Public Launch" — Wave 1 bundle (11 builders, 2026-05-15).
description = "Ship data products from a laptop — a local-first Python SDK + CLI for building Iceberg-native pipelines and analytics stacks; graduates cleanly to any Iceberg catalog"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Nucleus Team" }]
keywords = ["data-engineering", "iceberg", "duckdb", "polars", "lakehouse", "data-mesh"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering",
]

# ----------------------------------------------------------------------------
# Runtime dependencies — EXACT PINS REQUIRED (Constraint #11)
# ----------------------------------------------------------------------------
# Each line: pinned version + docs URL.
# To upgrade: see docs/internal/compatibility.md upgrade workflow.
#
# Install-size split (ADR-039, PoC #5 blocker, 2026-05-15)
# ---------------------------------------------------------
# `[project.dependencies]` below is the LEAN core: only the surface required
# to run `nucleus init / up / down / list / query / run` against SQLite +
# filesystem-Iceberg + the substrate (Dagster + OTEL no-op + OpenLineage
# emit). Source connectors (Postgres / MySQL / Snowflake), the AI Copilot,
# the Workbench HTTP stack, and observability exporters live under
# `[project.optional-dependencies]` below — `pip install nucleus-data[postgres]`,
# `nucleus[ai]`, `nucleus[workbench]`, `nucleus[all]`, etc.
#
# Hard limit: <30 entries in `[project.dependencies]` enforced by
# `scripts/check_install_size.py`. Target: clean install in <60 s on a warm
# pip cache (empirical numbers in ADR-039 §"Empirical install time").
dependencies = [
  # Tier 1 engines
  "duckdb==1.1.3",                  # Docs: https://duckdb.org/docs/api/python/overview
  "polars==1.18.0",                 # Docs: https://docs.pola.rs/api/python/stable/
  "pyarrow==18.1.0",                # Docs: https://arrow.apache.org/docs/python/

  # Tier 1 storage / table format
  "pyiceberg[sql-sqlite,s3fs,duckdb]==0.11.1",  # Docs: https://py.iceberg.apache.org/
  "s3fs==2026.4.0",                 # Explicit top-level pin per ADR-012 NV (b) cleared 2026-05-13. BSD-3-Clause. Docs: https://s3fs.readthedocs.io/

  # Tier 2 orchestration substrate (hidden behind ctx).
  # Dagster stays in core because `coordination/error_translation.py` lazy-imports
  # it on every materialize/run path; demoting it would break the beachhead E2E.
  "dagster==1.9.5",                 # Docs: https://docs.dagster.io/api

  # Schedule cron parsing + preview (ADR-017 schedule exposure).
  # croniter is also pulled transitively by dagster; this line makes it
  # a direct dep for explicit version governance.
  # Docs: https://pypi.org/project/croniter/ (croniter==3.0.4, MIT)
  "croniter==3.0.4",                # Docs: https://pypi.org/project/croniter/

  # SQL transformation (native ctx.sql + Jinja resolver, ≤2500 LOC).
  # sqlglot lives in [project.optional-dependencies] lineage-advanced
  # (ADR-012 amendment 2026-05-14); core uses jinja2 + regex + difflib only.
  "jinja2==3.1.6",                  # Docs: https://jinja.palletsprojects.com/

  # Core infrastructure.
  # msgspec removed entirely 2026-05-14 per docs/internal/research/otel_day1_decision.md §D3.
  "click==8.3.3",                   # CLI framework. Docs: https://click.palletsprojects.com/
  "structlog==24.4.0",              # Structured logging. Docs: https://www.structlog.org/
  "typer==0.15.1",                  # CLI ergonomics on top of Click. Docs: https://typer.tiangolo.com/
  "rich==13.9.4",                   # Terminal UI. Docs: https://rich.readthedocs.io/
  "pyyaml==6.0.3",                  # nucleus.yaml + .copilot_opt_in sentinel. Docs: https://pyyaml.org/wiki/PyYAMLDocumentation

  # Observability protocol (Tier 0 immortal per v4.1 §4.1).
  # API package only: produces no-op NonRecordingSpan when no TracerProvider is set
  # (https://opentelemetry-python.readthedocs.io/en/latest/api/trace.html).
  # SDK + exporters live under [project.optional-dependencies] observability per
  # ADR-011 amendment 2026-05-14.
  "opentelemetry-api==1.29.0",      # Docs: https://opentelemetry.io/docs/languages/python/

  # Lineage (asset-level v0.1; column-level v0.5+ via sqlglot)
  "openlineage-python==1.47.1",     # Docs: https://openlineage.io/docs/client/python

  # Minimal HTTP client — used by `nucleus up` MinIO ready-probe in
  # `cli/main.py` `_wait_local_storage_ready` (lazy-imported there).
  # Kept in core so the readiness probe survives without any extras.
  "httpx==0.28.1",                  # Docs: https://www.python-httpx.org/
]

# ----------------------------------------------------------------------------
# Optional dependencies (ADR-039 install-size split, 2026-05-15)
# ----------------------------------------------------------------------------
# Two tiers per ADR-012 amendment 2026-05-14 + ADR-039 install-size split
# (PoC #5 blocker — `pip install nucleus-data` <60 s, <30 deps):
#
#   1. Runtime extras  — exact pins required; checked by
#      `scripts/check_pinning.py` with the same `==` rule as
#      `[project] dependencies`. These are real runtime libraries shipped
#      behind opt-in install. Listed in RUNTIME_EXTRAS_GROUPS in
#      `scripts/check_pinning.py` (postgres, mysql, snowflake, s3, gcs, ai,
#      workbench, observability, lineage-advanced).
#
#   2. Dev / docs extras (`dev`, `docs`) — `==` or `~=` accepted by default
#      (linters/test runners can minor-flex); `--strict` upgrades to `==`-only.
#
# Install patterns:
#   pip install nucleus-data                       # core only (~16 deps, <60 s install)
#   pip install nucleus-data[postgres]             # + Postgres source connector
#   pip install nucleus-data[mysql]                # + MySQL source connector
#   pip install nucleus-data[snowflake]            # + Snowflake source connector
#   pip install nucleus-data[s3]                   # + raw S3 helpers (s3fs already in core)
#   pip install nucleus-data[gcs]                  # + GCS source connector
#   pip install nucleus-data[ai]                   # + AI Copilot (`nucleus chat`)
#   pip install nucleus-data[workbench]            # + Workbench HTTP UI (`nucleus workbench up`)
#   pip install nucleus-data[observability]        # + OTEL SDK for v0.5+ exporter wiring
#   pip install nucleus-data[lineage-advanced]     # + sqlglot for column-lineage walker
#   pip install -e ".[all]"                   # all runtime extras (no dev tooling)
#   pip install -e ".[dev]"                   # contributor lint/test environment
#   pip install -e ".[dev,all]"               # contributor + everything (CI default)
#
# Boundary rule (ADR-039 §"Per-module ownership matrix"): modules under
# `src/nucleus/` reachable from core code paths MUST NOT do a module-top
# `import psycopg / fastapi / litellm / dlt / snowflake / gcsfs`. The CLI uses
# lazy imports inside command bodies; module-level imports of optional libs
# crash users who installed core only. Validated in `tests/test_install_extras.py`.
[project.optional-dependencies]

# Postgres source connector (ADR-014, dlt sql_database Stage 1 wave 2026-05-13).
# Activates SQLAlchemy + psycopg3 + dlt's sql_database verified source.
# Install: `pip install nucleus-data[postgres]`
# Docs: https://docs.sqlalchemy.org/en/20/dialects/postgresql.html
#       https://www.psycopg.org/psycopg3/docs/
#       https://dlthub.com/docs/dlt-ecosystem/verified-sources/sql_database
# License: sqlalchemy MIT · GREEN; psycopg LGPLv3+ · YELLOW (dynamic-link exempt
# per ADR-007 §Tier 2); dlt Apache-2.0 · GREEN.
# Rollback: `pip uninstall psycopg sqlalchemy dlt` (extras can be re-added later).
postgres = [
  "sqlalchemy==2.0.36",                  # Docs: https://docs.sqlalchemy.org/en/20/
  "psycopg[binary]==3.2.3",              # Docs: https://www.psycopg.org/psycopg3/docs/
  "dlt[sql_database,pyiceberg]==1.26.0", # Docs: https://dlthub.com/docs/general-usage/pipeline
]

# MySQL source connector (ADR-014 §"MySQL parity (2026-05-14)").
# Activates SQLAlchemy + pymysql + dlt's sql_database. SQLAlchemy and dlt are
# duplicated with the postgres extras intentionally — `pip` dedups them at
# resolve time so users running `pip install nucleus-data[postgres,mysql]` get a
# single SQLAlchemy + single dlt.
# Install: `pip install nucleus-data[mysql]`
# Docs: https://docs.sqlalchemy.org/en/20/dialects/mysql.html
#       https://pymysql.readthedocs.io/
# License: pymysql MIT · GREEN; sqlalchemy MIT · GREEN; dlt Apache-2.0 · GREEN.
mysql = [
  "sqlalchemy==2.0.36",                  # Docs: https://docs.sqlalchemy.org/en/20/dialects/mysql.html
  "pymysql==1.1.1",                      # Docs: https://pymysql.readthedocs.io/
  "dlt[sql_database,pyiceberg]==1.26.0", # Docs: https://dlthub.com/docs/general-usage/pipeline
]

# Snowflake source connector (ADR-019, connector expansion wave 2026-05-15).
# Activates dlt's Snowflake extras (snowflake-connector-python + snowflake-sqlalchemy).
# Rollback: pip install "dlt[snowflake]==<prior>" (remove section and revert).
# Install: `pip install nucleus-data[snowflake]`
# Docs: https://docs.snowflake.com/en/developer-guide/python-connector/sqlalchemy
# License: snowflake-connector-python Apache-2.0 · GREEN; snowflake-sqlalchemy Apache-2.0 · GREEN.
snowflake = [
  "dlt[snowflake]==1.26.0",              # adds snowflake-connector-python + snowflake-sqlalchemy
]

# S3 helpers — `s3fs==2026.4.0` is ALREADY in core (Tier 1 pin), so the default
# install can read `s3://…` URIs via pyiceberg + DuckDB httpfs. This extras
# group is a self-reference for `pip install nucleus-data[s3]` discoverability and
# version-locks the same `s3fs` pin so a user-managed `[s3]` install matches
# core. Power users wanting the raw AWS SDK should `pip install boto3` directly.
# Install: `pip install nucleus-data[s3]`
# Docs: https://s3fs.readthedocs.io/
# License: BSD-3-Clause · GREEN.
s3 = [
  "s3fs==2026.4.0",                      # same pin as core; pip dedups
]

# GCS object-storage connector (ADR-020, connector expansion wave 2026-05-15).
# gcsfs provides ADC credentials + GCS filesystem for DuckDB register_filesystem().
# Install: `pip install nucleus-data[gcs]`
# Docs: https://gcsfs.readthedocs.io/en/latest/
# License: BSD-3-Clause · GREEN
# Upgrade smoke: add tests/upgrade_smoke/test_gcsfs.py before next version bump.
gcs = [
  "gcsfs==2026.5.0",                     # CalVer; BSD-3-Clause; Python >=3.10 (satisfies >=3.11,<3.13)
]

# AI Copilot — `nucleus chat` + intelligence layer wrappers (ADR-015).
# Install: `pip install nucleus-data[ai]`
# Docs: https://docs.litellm.ai/docs/
# License: MIT · GREEN. Wraps 100+ LLM providers; Python >=3.10,<3.14.
# Rollback: `pip install litellm==1.83.14` (or `pip uninstall litellm`).
# Upgrade smoke: tests/upgrade_smoke/test_litellm.py
# Friendly-error: if a user runs `nucleus chat` without this extra installed,
# `nucleus.intelligence.copilot` raises NE6001 pointing at
# `pip install nucleus-data[ai]` (rather than a raw ModuleNotFoundError).
ai = [
  "litellm==1.83.14",                    # MIT. Single new runtime dep per AGENTS.md §11.13
]

# Workbench HTTP UI — FastAPI + React SPA (ADR-016 Fork B).
# Install: `pip install nucleus-data[workbench]`
# Docs: https://fastapi.tiangolo.com/ · https://www.uvicorn.org/ · https://github.com/ijl/orjson
# License: fastapi MIT · GREEN; uvicorn BSD-3-Clause · GREEN; orjson (Apache-2.0 OR MIT) AND MPL-2.0 · YELLOW.
# Rollback: `pip uninstall fastapi uvicorn orjson` (the React SPA still ships in the wheel as static files).
workbench = [
  "fastapi==0.136.1",                    # Docs: https://fastapi.tiangolo.com/
  "uvicorn[standard]==0.46.0",           # Docs: https://www.uvicorn.org/
  "orjson==3.11.9",                      # Docs: https://github.com/ijl/orjson
]

# Opt-in OTEL SDK + exporters (per ADR-011 §1 substrate-vs-transport split,
# amended 2026-05-14: API stays in core as no-op substrate, SDK ships only when
# the v0.5+ collector-export ADR fires or a power user wires their own exporter).
# Install: `pip install nucleus-data[observability]`
# Docs: https://opentelemetry.io/docs/languages/python/exporters/
observability = [
  "opentelemetry-sdk==1.29.0",           # version-locked to opentelemetry-api in core
]

# Opt-in column-level lineage + asset-graph dep extraction
# (per docs/internal/research/sqlglot.md §10; first concrete caller v0.5+ per
# `docs/specs/nucleus_architecture_v4.1.md` §6.2 column-lineage roadmap).
# Note: when `nucleus[postgres]` / `nucleus[mysql]` / `nucleus[snowflake]` is
# installed, dlt transitively pulls sqlglot too — so those users effectively
# receive it without `[lineage-advanced]`. This extras group exposes sqlglot
# as a direct, version-locked dep for projects that import it without
# depending on dlt (e.g. pure DuckDB stacks).
# Install: `pip install nucleus-data[lineage-advanced]`
# Docs: https://sqlglot.com/sqlglot.html
lineage-advanced = [
  "sqlglot==26.0.0",
]

# Development environment
dev = [
  # Code quality
  "ruff==0.15.13",                   # Docs: https://docs.astral.sh/ruff/ — Upgraded 2026-05-15 per ADR-027; rollback: pip install ruff==0.8.4
  "mypy==1.13.0",                   # Docs: https://mypy.readthedocs.io/
  "pre-commit==4.0.1",              # Docs: https://pre-commit.com/
  "psutil==7.2.2",                  # Boot-time + memory measurement (PoC #4). Docs: https://psutil.readthedocs.io/
  # Verified 2026-05-13: v7.2.2 current on PyPI; BSD-3-Clause; Python >=3.6 (includes 3.11).

  # Testing
  "pytest==8.3.4",                  # Docs: https://docs.pytest.org/
  "pytest-cov==6.0.0",              # Docs: https://pytest-cov.readthedocs.io/
  "pytest-xdist==3.6.1",            # Parallel test execution
  "pytest-asyncio==0.25.0",         # For any async surface tests
  "hypothesis==6.123.7",            # Property-based testing for type mappings

  # Local infrastructure for tests
  "testcontainers==4.9.0",          # Postgres/MinIO containers for integration tests

  # Optional runtime packages mirrored for the dev test matrix.
  # Post-ADR-039 the install-size split moves these out of the default end-user
  # install (`pip install nucleus-data`), but contributors running `pip install -e ".[dev]"`
  # need every feature importable so the full test suite (tests/copilot/,
  # tests/workbench/, tests/connectors/, tests/upgrade_smoke/) runs end-to-end.
  # ADR-039 §3 ("Extras Design"): the split is for END USERS, not for dev.
  # Pins MUST match the source extras group exactly so pip resolver dedups
  # cleanly when contributors run `pip install -e ".[dev,all]"`.
  "dlt[sql_database,pyiceberg]==1.26.0", # Source pin: [postgres] / [mysql] groups (lines 154, 169)
  "litellm==1.83.14",               # Source pin: [ai] group (line 214); MIT
  "fastapi==0.136.1",               # Source pin: [workbench] group (line 223)
  "uvicorn[standard]==0.46.0",      # Source pin: [workbench] group (line 224)
  "httpx==0.28.1",                  # Source pin: [project.dependencies] core (line 101)

  # Build / packaging
  "hatchling==1.27.0",
  "build==1.2.2.post1",
]

# Documentation
# Docs: https://squidfunk.github.io/mkdocs-material/
# Install: pip install -e ".[docs]"
# Build: mkdocs build --strict
# Serve: mkdocs serve
docs = [
  "mkdocs==1.6.1",                               # Docs: https://www.mkdocs.org/
  "mkdocs-material==9.5.49",                     # Docs: https://squidfunk.github.io/mkdocs-material/
  "mkdocstrings[python]==0.27.0",                # Docs: https://mkdocstrings.github.io/
  "mkdocs-include-markdown-plugin==7.2.2",       # Docs: https://github.com/mondeja/mkdocs-include-markdown-plugin
  "mkdocs-glightbox==0.5.2",                     # Docs: https://github.com/blueswen/mkdocs-glightbox
  "pymdown-extensions==10.21.3",                 # Docs: https://facelessuser.github.io/pymdown-extensions/
]

# Meta-group: union of every RUNTIME extras group (no `dev`, no `docs`).
# Per PEP 508 self-reference: `nucleus[...]` resolves when installing this
# package from a local checkout (`pip install -e ".[all]"`) or from PyPI
# (`pip install nucleus-data[all]`). Verified against `pip>=21.2` (we ship with
# pip 26.x in dev) per PEP 631 + https://peps.python.org/pep-0508/#extras.
# Contributors who also want lint/test should run `pip install -e ".[dev,all]"`.
all = [
  "nucleus[postgres,mysql,snowflake,s3,gcs,ai,workbench,observability,lineage-advanced]",
]

# ----------------------------------------------------------------------------
# Entry points
# ----------------------------------------------------------------------------
[project.scripts]
nucleus = "nucleus.cli.main:app"

# ----------------------------------------------------------------------------
# URLs
# ----------------------------------------------------------------------------
[project.urls]
Homepage = "https://github.com/nucleus-data/nucleus"  # Update when org created
Documentation = "https://nucleus.dev"                  # Aspirational
Repository = "https://github.com/nucleus-data/nucleus"
Issues = "https://github.com/nucleus-data/nucleus/issues"
Changelog = "https://github.com/nucleus-data/nucleus/blob/main/CHANGELOG.md"

# ============================================================================
# Tool configurations
# ============================================================================

# ----------------------------------------------------------------------------
# Hatch (build backend)
# ----------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/nucleus"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/poc",
  "/docs",
  "/scripts",
  "/AGENTS.md",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]
exclude = [
  "*.pyc",
  "__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
]

# ----------------------------------------------------------------------------
# Ruff (linter + formatter)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "poc", "scripts"]
exclude = [
  "src/nucleus/templates/",  # template files use str.format() escapes ({{}} not {}) — ruff must not touch
]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "W",      # pycodestyle warnings
  "I",      # isort
  "B",      # flake8-bugbear
  "UP",     # pyupgrade
  "N",      # pep8-naming
  "SIM",    # flake8-simplify
  "RUF",    # ruff-specific
  "PL",     # pylint
  "PTH",    # use pathlib
  "RET",    # flake8-return
  "ARG",    # unused arguments
  "TID",    # tidy imports
  "ERA",    # eradicate commented-out code
  "PIE",    # flake8-pie
  "PERF",   # perflint
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "PLR0913", # too many arguments (we use kwargs heavily)
  "PLR2004", # magic value comparison (too noisy for SQL/data code)
  "PLC0415", # import-outside-top-level (lazy imports are intentional for boot time per PoC #4)
  "SIM105",  # use contextlib.suppress() — low-priority; existing try/except/pass patterns
  "N818",    # exception-name-should-end-in-error — NucleusRunCancelled intentionally named as signal
  "RUF022",  # unsorted-dunder-all — __all__ ordered by logical grouping (ADR-006 §1 layer bands)
]

[tool.ruff.lint.per-file-ignores]
# Tests, PoCs, scripts, examples, and the docs/ diagram generator are
# developer / release tooling — not library-grade code. They legitimately
# use magic values, asserts, ad-hoc helpers, EN-DASH typography in comments,
# unused-arg fixtures, and one-off complexity that triggers style heuristics.
# Real correctness rules (F-series logic, B-series safety, E402) stay active.
# Per founder directive 2026-05-16 (CI Lint Option B): mirror the long-standing
# tests/poc precedent for scripts/examples/docs/diagrams.
"tests/**/*.py" = [
  "PLR2004", "S101", "PLR0913",
  "ARG001", "ARG002", "RUF001", "RUF002", "RUF003", "ERA001", "F401",
  "SIM117", "RUF059", "RUF100", "E741", "F541",
  "PTH105", "PTH123", "I001",
]
"poc/**/*.py" = ["PLR2004", "S101"]
"scripts/**/*.py" = [
  "ARG001", "RUF001", "RUF003", "RUF002", "ERA001", "RUF100", "F401", "F841",
  "PLR0915", "PLR0912", "PLR0911", "PLR0913", "PLR0402", "PLR2004", "PLR0124",
  "I001", "N806", "N802", "N803",
  "SIM103", "SIM114", "SIM117", "PERF401", "PERF402",
  "B007", "B905", "PTH105", "PTH123",
  "PLW0108", "RUF005", "RUF007", "RUF034", "RUF046", "RUF059",
  "E401", "E701", "E702", "E731", "E741",
  "F541", "F811", "T201", "S101", "UP037",
]
"examples/**/*.py" = ["PLR0402", "I001", "F401", "RUF046", "RUF100", "UP017", "RUF002"]
"docs/architecture/diagrams/**/*.py" = ["E741", "PLR0915", "ERA001", "B007", "F541"]
# Per-file ignores for v0.2 src/nucleus modules where the rule is a legitimate
# style/complexity heuristic, not a correctness bug (dispatchers with many
# branches, Windows ctypes constants, EN-DASH typography in user-facing docs).
# `_dispatch.py` is intentionally NOT relaxed — its 3 PLR0911/N806 hits were
# fixed in-place per the per-file-ignore Option B commit message.
"src/nucleus/cli/main.py" = ["E402", "RUF100", "PLR0915"]
"src/nucleus/cli/commands/runs.py" = ["B904"]
"src/nucleus/cli/commands/schedule.py" = ["F821"]
"src/nucleus/cli/commands/snapshot.py" = ["I001"]
"src/nucleus/coordination/asset_materialization.py" = ["E402", "RUF100", "PLR0915", "PLR0911"]
"src/nucleus/coordination/bi_handshake.py" = ["RUF100"]
"src/nucleus/coordination/daemon.py" = ["SIM103"]
"src/nucleus/coordination/error_budget.py" = ["RUF002", "RUF003"]
"src/nucleus/coordination/locks.py" = ["PLR0911", "N806"]
"src/nucleus/coordination/run_ledger.py" = ["PLW2901"]
"src/nucleus/coordination/snapshot_maintenance.py" = ["ERA001"]
"src/nucleus/ctx/copy_from.py" = ["ERA001"]
"src/nucleus/ctx/copy_from_filesystem.py" = ["PLR0911"]
"src/nucleus/ctx/copy_from_gcs.py" = ["PLR0911"]
"src/nucleus/ctx/copy_from_s3.py" = ["PLR0911"]
"src/nucleus/workbench/api/catalog.py" = ["I001", "RUF002"]
"src/nucleus/workbench/api/chat.py" = ["PTH109"]
"src/nucleus/workbench/api/query.py" = ["PTH109", "PERF401"]
"src/nucleus/workbench/api/schedules.py" = ["RUF002"]
"src/nucleus/workbench/api/search.py" = ["PERF401"]

[tool.ruff.lint.isort]
known-first-party = ["nucleus"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ----------------------------------------------------------------------------
# Mypy (static type checking — STRICT mode)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src/nucleus", "tests", "poc", "scripts"]

# Wrapped libraries — be explicit about missing stubs
[[tool.mypy.overrides]]
module = [
  "dagster.*",
  "pyiceberg.*",
  "duckdb.*",
  "sqlglot.*",
  "testcontainers.*",
]
ignore_missing_imports = false
follow_imports = "silent"

# Stub-less third-party libs (Constraint #10): we cite official docs in the
# import line, so mypy errors of [import-untyped] / [import-not-found] add no
# safety value here. types-* stub packages are not pinned (would add dev deps);
# instead we accept untyped imports for these specific wrapped libraries.
# Per founder directive 2026-05-16 (CI Lint Option B): mirror the long-standing
# ignore_missing_imports pattern from the [[tool.ruff.lint.per-file-ignores]]
# precedent for libraries that ship without py.typed markers.
[[tool.mypy.overrides]]
module = [
  "croniter.*",                 # https://pypi.org/project/croniter/
  "psutil.*",                   # types-psutil exists but adds dev dep churn
  "pyarrow.*",                  # partial typing only; no py.typed marker
  "gcsfs.*",                    # https://gcsfs.readthedocs.io/
  "dlt.*",                      # dlt's typing has many quirks (see copy_from_*)
  "litellm.*",                  # https://docs.litellm.ai/
  "fastapi.*",                  # FastAPI ships py.typed but exception scoping confuses strict mode
  "uvicorn.*",                  # https://www.uvicorn.org/
  "openlineage.*",              # generated facets re-export across modules trip strict equality
  "fcntl.*",                    # POSIX-only stdlib (Windows lacks it)
  "msvcrt.*",                   # Windows-only stdlib (POSIX lacks it)
]
ignore_missing_imports = true

# Per-module strictness relaxation for tooling-grade Nucleus modules.
# Per founder directive 2026-05-16 (CI Lint Option B): library-grade leniency
# for tooling-grade code; strict checking preserved for the stable public API
# surface (`sdk/`, `ctx/`, `coordination/` core, `errors`).
#
# Each module below has a concrete reason to relax specific checks; we prefer
# targeted per-rule disables over blanket `ignore_errors = true` so genuine
# regressions still surface.

# Workbench API routes — FastAPI exception-handler typing trips mypy on the
# `except ... as err: raise HTTPException(...) from err` pattern (Python's
# exception variable scope rules + FastAPI's untyped HTTPException kwargs).
# See workbench/api/{catalog,query,runs,assets,dashboard,chat,schedules}.py.
[[tool.mypy.overrides]]
module = "nucleus.workbench.api.*"
disable_error_code = ["misc", "attr-defined", "call-arg", "assignment", "no-any-return"]
warn_unused_ignores = false

# Workbench non-API helpers — same FastAPI typing edges around dependency
# injection helpers and middleware glue.
[[tool.mypy.overrides]]
module = "nucleus.workbench.*"
warn_unused_ignores = false

# Intelligence layer (LLM glue) — litellm + provider-specific call-args make
# strict typing impractical without per-provider stubs we don't ship.
[[tool.mypy.overrides]]
module = "nucleus.intelligence.*"
disable_error_code = ["attr-defined", "no-any-return", "union-attr"]
warn_unused_ignores = false

# CLI commands — Typer/Click decorators generate untyped wrappers; the
# `# type: ignore[attr-defined]` on snapshot subcommands becomes "unused" once
# the surrounding command surface tightens up, which is normal churn.
[[tool.mypy.overrides]]
module = "nucleus.cli.commands.*"
disable_error_code = ["attr-defined", "name-defined", "arg-type"]
warn_unused_ignores = false

# Connector adapters wrapping dlt sql_database — dlt's resource factory has
# variant overload signatures that strict mode can't reconcile with **kwargs
# expansion (every overload reports a different expected type for the same
# argument). The runtime contract is verified in tests/connectors/.
[[tool.mypy.overrides]]
module = [
  "nucleus.ctx.copy_from_mysql",
  "nucleus.ctx.copy_from_postgres",
  "nucleus.ctx.copy_from_snowflake",
  "nucleus.ctx.copy_from_gcs",
]
disable_error_code = ["arg-type", "call-overload", "call-arg"]
warn_unused_ignores = false

# Cross-platform locks — stdlib fcntl/msvcrt are platform-conditional, so a
# `# type: ignore[import]` is "unused" on the platform where the module exists.
# Windows ctypes.windll is only present on Windows. Behaviour is verified by
# tests/coordination/test_locks.py on every platform in CI.
[[tool.mypy.overrides]]
module = "nucleus.coordination.locks"
disable_error_code = ["attr-defined"]
warn_unused_ignores = false

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-v",
  "--strict-markers",
  "--strict-config",
  "--cov=nucleus",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=70",  # increase as we mature
]
testpaths = ["tests", "poc"]
markers = [
  "slow: tests that take >5s",
  "integration: tests requiring external services (Postgres, MinIO)",
  "poc: PoC validation tests (poc/ directory)",
  "smoke: minimal smoke tests for swap targets (Constraint #9)",
  "upgrade: dependency upgrade smoke tests (Constraint #11)",
]
asyncio_mode = "auto"

# ----------------------------------------------------------------------------
# Coverage
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/nucleus"]
branch = true
parallel = true
omit = [
  "*/tests/*",
  "*/internal/poc/*",
  "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@overload",
]
show_missing = true
skip_covered = false
fail_under = 70

# ----------------------------------------------------------------------------
# Custom Nucleus tool config (read by our scripts/)
# ----------------------------------------------------------------------------
[tool.nucleus]
# LOC budget enforcement (Constraint #8)
loc_budget_v01_ceiling = 8000      # Target end of v0.1 / Tier 1
loc_budget_v05_ceiling = 18000     # Target end of v0.5 / Tier 4
loc_budget_v10_ceiling = 30000     # Hard ceiling for v1.0 / GA

# Files excluded from LOC count
loc_exclude = [
  "tests/",
  "poc/",
  "docs/",
  "scripts/",
  "*.pyi",
  "**/__init__.py",  # often just exports
]

# Forbidden imports in user-facing code (v4.1 §6.4: Error Translation Discipline)
# These leak Dagster mental model to users. ctx SDK boundary only.
forbidden_user_imports = [
  "dagster",
  "dagster._",
]

# Vocabulary check (per AGENTS.md §7)
forbidden_terms_in_docs = [
  "metastore",      # use: catalog
  "Spark killer",
  "Databricks killer",
  "Data OS",
  "AI-native",      # we are AI-assisted
  "AI-first",
]
