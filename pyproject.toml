# ============================================================================
# Nucleus — Python project configuration
# ============================================================================
# Per AGENTS.md Hard Constraint #11: all runtime dependencies use EXACT pins.
# Per AGENTS.md Hard Constraint #10: every wrapped library has docs reference.
# Version updates: ONE component per PR; smoke tests required; rollback documented.
# See docs/compatibility.md for current tested versions.
# ============================================================================

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nucleus"
version = "0.2.0"  # Tier 2 "Public Launch" — Wave 1 bundle (11 builders, 2026-05-15).
description = "Ship data products from a laptop — a local-first Python SDK + CLI for building Iceberg-native pipelines and analytics stacks; graduates cleanly to any Iceberg catalog"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Nucleus Team" }]
keywords = ["data-engineering", "iceberg", "duckdb", "polars", "lakehouse", "data-mesh"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering",
]

# ----------------------------------------------------------------------------
# Runtime dependencies — EXACT PINS REQUIRED (Constraint #11)
# ----------------------------------------------------------------------------
# Each line: pinned version + docs URL.
# To upgrade: see docs/compatibility.md upgrade workflow.
dependencies = [
  # Tier 1 engines
  "duckdb==1.1.3",                  # Docs: https://duckdb.org/docs/api/python/overview
  "polars==1.18.0",                 # Docs: https://docs.pola.rs/api/python/stable/
  "pyarrow==18.1.0",                # Docs: https://arrow.apache.org/docs/python/

  # Tier 1 storage / table format
  "pyiceberg[sql-sqlite,s3fs,duckdb]==0.11.1",  # Docs: https://py.iceberg.apache.org/
  "s3fs==2026.4.0",                 # Explicit top-level pin per ADR-012 NV (b) cleared 2026-05-13. BSD-3-Clause. Docs: https://s3fs.readthedocs.io/

  # Tier 2 orchestration substrate (hidden behind ctx)
  "dagster==1.9.5",                 # Docs: https://docs.dagster.io/api

  # Tier 2 ingestion helpers (for ctx.copy_from in v0.1)
  "sqlalchemy==2.0.36",             # Docs: https://docs.sqlalchemy.org/en/20/
  "psycopg[binary]==3.2.3",         # Docs: https://www.psycopg.org/psycopg3/docs/
  "pymysql==1.1.1",                 # Docs: https://pymysql.readthedocs.io/
  # dlt Stage 1 Postgres source (ADR-014, 2026-05-13). Exact pin per AGENTS.md §11.13.
  # One-component-per-PR per §11.13; 24 h cool-down after merge.
  # Rollback: pip install dlt==1.26.0 (or git revert the PR; see ADR-014 §Rollback).
  # Docs: https://dlthub.com/docs/general-usage/pipeline
  # Upgrade smoke: tests/upgrade_smoke/test_dlt_upgrade.py
  "dlt[sql_database,pyiceberg]==1.26.0",  # Apache-2.0 · JVM-free (pyiceberg-core = Rust)

  # Schedule cron parsing + preview (ADR-017 schedule exposure).
  # One-component-per-PR per AGENTS.md §11.13 Constraint #11.
  # Version constraint: dagster==1.9.5 requires croniter<4,>=0.3.34; pin to latest
  # <4 release (3.0.4, released 2024-10-25). croniter is already a transitive dep
  # via dagster — this line makes it a direct dep for explicit version governance.
  # Rollback: pip install croniter==3.0.3 (or remove line + rely on dagster transitive).
  # Docs: https://pypi.org/project/croniter/ (croniter==3.0.4, MIT, Python >=2.6)
  # Upgrade smoke: requires dagster upgrade or croniter<4 constraint update first.
  "croniter==3.0.4",                # Docs: https://pypi.org/project/croniter/

  # SQL transformation (native ctx.sql + Jinja resolver, ≤2500 LOC).
  # sqlglot moved to [project.optional-dependencies] lineage-advanced 2026-05-14
  # per docs/research/otel_day1_decision.md §D2 (zero v0.1 callers; PoC #2 promoted
  # with jinja2 + regex + difflib only). Note: dlt 1.26.0 transitively requires
  # sqlglot, so users with the default install still receive it via dlt.
  "jinja2==3.1.6",                  # Docs: https://jinja.palletsprojects.com/

  # Core infrastructure.
  # msgspec removed entirely 2026-05-14 per docs/research/otel_day1_decision.md §D3
  # (zero callers under src/ tests/ poc/ scripts/; pure-stdlib substitutes suffice).
  "click==8.1.8",                   # CLI framework. Docs: https://click.palletsprojects.com/
  "structlog==24.4.0",              # Structured logging. Docs: https://www.structlog.org/
  "typer==0.15.1",                  # CLI ergonomics on top of Click. Docs: https://typer.tiangolo.com/
  "rich==13.9.4",                   # Terminal UI. Docs: https://rich.readthedocs.io/
  "pyyaml==6.0.3",                  # Used by CLI + intelligence/copilot for nucleus.yaml + opt-in. Docs: https://pyyaml.org/wiki/PyYAMLDocumentation
  "orjson==3.11.9",                 # Workbench FastAPI default response class (~3x faster). Docs: https://github.com/ijl/orjson

  # Observability protocol (Tier 0 immortal per v4.1 §4.1).
  # API package only: produces no-op NonRecordingSpan when no TracerProvider is set
  # (https://opentelemetry-python.readthedocs.io/en/latest/api/trace.html).
  # SDK + exporters live under [project.optional-dependencies] observability per
  # ADR-011 amendment 2026-05-14 (substrate-presence honored without shipping SDK
  # bytes to non-opt-in users; docs/research/otel_day1_decision.md §D1).
  "opentelemetry-api==1.29.0",      # Docs: https://opentelemetry.io/docs/languages/python/

  # Lineage (asset-level v0.1; column-level v0.5+ via sqlglot)
  "openlineage-python==1.47.1",     # Docs: https://openlineage.io/docs/client/python

  # Workbench v0.2 HTTP stack (ADR-016). Pins verified on PyPI 2026-05-13.
  "fastapi==0.136.1",               # Docs: https://fastapi.tiangolo.com/
  "httpx==0.28.1",                  # Docs: https://www.python-httpx.org/
  "uvicorn[standard]==0.46.0",      # Docs: https://www.uvicorn.org/

  # Intelligence / AI Copilot (v0.2+, ADR-015). Single new runtime dep.
  # Rollback: pip install litellm==1.83.14 (or git revert this PR).
  # Upgrade smoke: tests/upgrade_smoke/test_litellm.py
  # Docs: https://docs.litellm.ai/docs/
  "litellm==1.83.14",               # MIT. Wraps 100+ LLM providers; Python >=3.10,<3.14.
]

# ----------------------------------------------------------------------------
# Optional dependencies
# ----------------------------------------------------------------------------
# Two tiers per ADR-012 amendment 2026-05-14:
#   1. Runtime extras (`observability`, `lineage-advanced`) — exact pins required;
#      checked by scripts/check_pinning.py with the same `==` rule as
#      [project] dependencies. These are real runtime libs gated behind opt-in.
#   2. Dev/docs extras (`dev`, `docs`) — `==` or `~=` accepted by default
#      (linters/test runners can minor-flex); `--strict` upgrades to `==`-only.
#
# Install patterns:
#   pip install nucleus                       # core only (~2-3 MB lighter)
#   pip install nucleus[observability]        # + OTEL SDK for v0.5+ exporter wiring
#   pip install nucleus[lineage-advanced]     # + sqlglot for column-lineage / SQL walker
#   pip install -e ".[dev]"                   # contributor environment
#   pip install -e ".[all]"                   # everything (CI convenience)
[project.optional-dependencies]

# Opt-in OTEL SDK + exporters (per ADR-011 §1 substrate-vs-transport split,
# amended 2026-05-14: API stays in core as no-op substrate, SDK ships only when
# the v0.5+ collector-export ADR fires or a power user wires their own exporter).
# Install: `pip install nucleus[observability]`
# Docs: https://opentelemetry.io/docs/languages/python/exporters/
observability = [
  "opentelemetry-sdk==1.29.0",      # version-locked to opentelemetry-api in core
]

# Snowflake source connector (ADR-019, connector expansion wave 2026-05-15).
# Activates dlt's Snowflake extras (snowflake-connector-python + snowflake-sqlalchemy).
# The base dlt==1.26.0 is already in core; this extras group adds the Snowflake dialect.
# Rollback: pip install "dlt[snowflake]==<prior>" (remove section and revert to prior dlt pin).
# Install: `pip install nucleus[snowflake]`
# Docs: https://docs.snowflake.com/en/developer-guide/python-connector/sqlalchemy
# License: snowflake-connector-python Apache-2.0 · GREEN; snowflake-sqlalchemy Apache-2.0 · GREEN
snowflake = [
  "dlt[snowflake]==1.26.0",  # same pin as core dlt; adds Snowflake dialect extras
]

# GCS object-storage connector (ADR-020, connector expansion wave 2026-05-15).
# gcsfs provides ADC credentials + GCS filesystem for DuckDB register_filesystem().
# Install: `pip install nucleus[gcs]`
# Docs: https://gcsfs.readthedocs.io/en/latest/
# License: BSD-3-Clause · GREEN
# Upgrade smoke: add tests/upgrade_smoke/test_gcsfs.py before next version bump.
gcs = [
  "gcsfs==2026.5.0",  # CalVer; BSD-3-Clause; Python >=3.10 (satisfies >=3.11,<3.13)
]

# Opt-in column-level lineage + asset-graph dep extraction
# (per docs/research/sqlglot.md §10; first concrete caller v0.5+ per
# `nucleus_architecture_v4.1.md` §6.2 column-lineage roadmap).
# Note: `dlt[sql_database,pyiceberg]==1.26.0` already pulls sqlglot transitively,
# so users running the default install receive it indirectly. This extras group
# exposes sqlglot as a direct, version-locked dep for projects that import it
# explicitly without depending on dlt.
# Install: `pip install nucleus[lineage-advanced]`
# Docs: https://sqlglot.com/sqlglot.html
lineage-advanced = [
  "sqlglot==26.0.0",
]

# Development environment
dev = [
  # Code quality
  "ruff==0.15.13",                   # Docs: https://docs.astral.sh/ruff/ — Upgraded 2026-05-15 per ADR-027; rollback: pip install ruff==0.8.4
  "mypy==1.13.0",                   # Docs: https://mypy.readthedocs.io/
  "pre-commit==4.0.1",              # Docs: https://pre-commit.com/
  "psutil==7.2.2",                  # Boot-time + memory measurement (PoC #4). Docs: https://psutil.readthedocs.io/
  # Verified 2026-05-13: v7.2.2 current on PyPI; BSD-3-Clause; Python >=3.6 (includes 3.11).

  # Testing
  "pytest==8.3.4",                  # Docs: https://docs.pytest.org/
  "pytest-cov==6.0.0",              # Docs: https://pytest-cov.readthedocs.io/
  "pytest-xdist==3.6.1",            # Parallel test execution
  "pytest-asyncio==0.25.0",         # For any async surface tests
  "hypothesis==6.123.7",            # Property-based testing for type mappings

  # Local infrastructure for tests
  "testcontainers==4.9.0",          # Postgres/MinIO containers for integration tests

  # Build / packaging
  "hatchling==1.27.0",
  "build==1.2.2.post1",
]

# Documentation
# Docs: https://squidfunk.github.io/mkdocs-material/
# Install: pip install -e ".[docs]"
# Build: mkdocs build --strict
# Serve: mkdocs serve
docs = [
  "mkdocs==1.6.1",                               # Docs: https://www.mkdocs.org/
  "mkdocs-material==9.5.49",                     # Docs: https://squidfunk.github.io/mkdocs-material/
  "mkdocstrings[python]==0.27.0",                # Docs: https://mkdocstrings.github.io/
  "mkdocs-include-markdown-plugin==7.2.2",       # Docs: https://github.com/mondeja/mkdocs-include-markdown-plugin
  "mkdocs-glightbox==0.5.2",                     # Docs: https://github.com/blueswen/mkdocs-glightbox
  "pymdown-extensions==10.21.3",                 # Docs: https://facelessuser.github.io/pymdown-extensions/
]

# All extras (CI convenience)
all = ["nucleus[dev,docs,observability,lineage-advanced,snowflake,gcs]"]

# ----------------------------------------------------------------------------
# Entry points
# ----------------------------------------------------------------------------
[project.scripts]
nucleus = "nucleus.cli.main:app"

# ----------------------------------------------------------------------------
# URLs
# ----------------------------------------------------------------------------
[project.urls]
Homepage = "https://github.com/nucleus-data/nucleus"  # Update when org created
Documentation = "https://nucleus.dev"                  # Aspirational
Repository = "https://github.com/nucleus-data/nucleus"
Issues = "https://github.com/nucleus-data/nucleus/issues"
Changelog = "https://github.com/nucleus-data/nucleus/blob/main/CHANGELOG.md"

# ============================================================================
# Tool configurations
# ============================================================================

# ----------------------------------------------------------------------------
# Hatch (build backend)
# ----------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/nucleus"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/poc",
  "/docs",
  "/scripts",
  "/AGENTS.md",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]
exclude = [
  "*.pyc",
  "__pycache__",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
]

# ----------------------------------------------------------------------------
# Ruff (linter + formatter)
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "poc", "scripts"]
exclude = [
  "src/nucleus/templates/",  # template files use str.format() escapes ({{}} not {}) — ruff must not touch
]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "W",      # pycodestyle warnings
  "I",      # isort
  "B",      # flake8-bugbear
  "UP",     # pyupgrade
  "N",      # pep8-naming
  "SIM",    # flake8-simplify
  "RUF",    # ruff-specific
  "PL",     # pylint
  "PTH",    # use pathlib
  "RET",    # flake8-return
  "ARG",    # unused arguments
  "TID",    # tidy imports
  "ERA",    # eradicate commented-out code
  "PIE",    # flake8-pie
  "PERF",   # perflint
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "PLR0913", # too many arguments (we use kwargs heavily)
  "PLR2004", # magic value comparison (too noisy for SQL/data code)
  "PLC0415", # import-outside-top-level (lazy imports are intentional for boot time per PoC #4)
  "SIM105",  # use contextlib.suppress() — low-priority; existing try/except/pass patterns
  "N818",    # exception-name-should-end-in-error — NucleusRunCancelled intentionally named as signal
  "RUF022",  # unsorted-dunder-all — __all__ ordered by logical grouping (ADR-006 §1 layer bands)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101", "PLR0913"]  # tests can use magic values, assert, many args
"poc/**/*.py" = ["PLR2004", "S101"]               # PoCs are exploratory
"src/nucleus/cli/main.py" = ["E402"]              # intentional late imports for command registration
"src/nucleus/coordination/asset_materialization.py" = ["E402"]  # SDK imports after logger init (circular-import safe)

[tool.ruff.lint.isort]
known-first-party = ["nucleus"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ----------------------------------------------------------------------------
# Mypy (static type checking — STRICT mode)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src/nucleus", "tests", "poc", "scripts"]

# Wrapped libraries — be explicit about missing stubs
[[tool.mypy.overrides]]
module = [
  "dagster.*",
  "pyiceberg.*",
  "duckdb.*",
  "sqlglot.*",
  "testcontainers.*",
]
ignore_missing_imports = false
follow_imports = "silent"

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-v",
  "--strict-markers",
  "--strict-config",
  "--cov=nucleus",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=70",  # increase as we mature
]
testpaths = ["tests", "poc"]
markers = [
  "slow: tests that take >5s",
  "integration: tests requiring external services (Postgres, MinIO)",
  "poc: PoC validation tests (poc/ directory)",
  "smoke: minimal smoke tests for swap targets (Constraint #9)",
  "upgrade: dependency upgrade smoke tests (Constraint #11)",
]
asyncio_mode = "auto"

# ----------------------------------------------------------------------------
# Coverage
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/nucleus"]
branch = true
parallel = true
omit = [
  "*/tests/*",
  "*/poc/*",
  "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@overload",
]
show_missing = true
skip_covered = false
fail_under = 70

# ----------------------------------------------------------------------------
# Custom Nucleus tool config (read by our scripts/)
# ----------------------------------------------------------------------------
[tool.nucleus]
# LOC budget enforcement (Constraint #8)
loc_budget_v01_ceiling = 8000      # Target end of v0.1 / Tier 1
loc_budget_v05_ceiling = 18000     # Target end of v0.5 / Tier 4
loc_budget_v10_ceiling = 30000     # Hard ceiling for v1.0 / GA

# Files excluded from LOC count
loc_exclude = [
  "tests/",
  "poc/",
  "docs/",
  "scripts/",
  "*.pyi",
  "**/__init__.py",  # often just exports
]

# Forbidden imports in user-facing code (v4.1 §6.4: Error Translation Discipline)
# These leak Dagster mental model to users. ctx SDK boundary only.
forbidden_user_imports = [
  "dagster",
  "dagster._",
]

# Vocabulary check (per AGENTS.md §7)
forbidden_terms_in_docs = [
  "metastore",      # use: catalog
  "Spark killer",
  "Databricks killer",
  "Data OS",
  "AI-native",      # we are AI-assisted
  "AI-first",
]
