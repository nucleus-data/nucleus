# Local MinIO stack for nucleus up / nucleus down (v0.1).
# REST Iceberg catalogs are deferred — filesystem catalog stays on-disk.
#
# Image (pinned release): https://hub.docker.com/r/minio/minio/tags
# Compose reference: https://docs.docker.com/compose/reference/

services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
