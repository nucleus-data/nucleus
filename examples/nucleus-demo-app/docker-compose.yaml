# Local infrastructure for the Nucleus demo project.
#
# Starts MinIO (S3-compatible blob storage) and Postgres (the source of truth
# for the bronze ingest assets). Ports are bumped from the upstream defaults
# (5433 / 9100 / 9101) so the demo coexists with anything the developer is
# already running on 5432 / 9000 / 9001.
#
# Compose reference: https://docs.docker.com/compose/compose-file/
# MinIO image tags: https://hub.docker.com/r/minio/minio/tags
# Postgres image tags: https://hub.docker.com/_/postgres

services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nucleus
      POSTGRES_PASSWORD: nucleus
      POSTGRES_DB: nucleus_demo
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/seed:/seed:ro
