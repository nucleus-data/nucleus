# Local MinIO + Postgres for the e-commerce example.
# Compose file format: https://docs.docker.com/compose/compose-file/
# MinIO image tags: https://hub.docker.com/r/minio/minio/tags

services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nucleus
      POSTGRES_PASSWORD: nucleus
      POSTGRES_DB: ecommerce_demo
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/seed_postgres.sql:/docker-entrypoint-initdb.d/00-seed.sql:ro
