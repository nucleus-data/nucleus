# Nucleus pre-commit hooks (minimal v0.2 community pack subset).
# Install: python -m pip install pre-commit && pre-commit install
# Docs: https://pre-commit.com/
minimum_pre_commit_version: "4.0.0"
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-vocabulary
        name: check_vocabulary
        entry: python scripts/check_vocabulary.py
        language: system
        pass_filenames: false
      - id: check-pinning
        name: check_pinning
        entry: python scripts/check_pinning.py
        language: system
        pass_filenames: false
