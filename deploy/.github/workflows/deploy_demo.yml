# GitHub Action — deploy the public Nucleus demo to Fly.io (or Render).
#
# *** TEMPLATE LOCATION ***
#
# This file lives at ``deploy/.github/workflows/deploy_demo.yml`` so it ships
# with the deploy bundle and reviews cleanly alongside the other deploy
# artifacts.  To make the workflow ACTIVE, the founder must copy (not move)
# it to the repo's real workflow directory:
#
#     cp deploy/.github/workflows/deploy_demo.yml \
#        .github/workflows/deploy_demo.yml
#
# (Step 11 in docs/release/public_demo_deploy_plan.md §9 founder runbook.)
#
# Trigger: any tag matching v[0-9]+.[0-9]+.[0-9]+* — matches the existing
# release.yml convention.  Add ``workflow_dispatch`` for manual triggers
# (rollbacks, redeploys without a new tag).
#
# Hosts supported: Fly.io (recommended) + Render (alternative).  The job
# auto-detects which secret is present and skips the other:
#   - FLY_API_TOKEN set → flyctl deploy
#   - RENDER_DEPLOY_HOOK_URL set → curl POST to Render hook
# Both can be set; both will run.
#
# Docs: https://docs.github.com/en/actions/using-workflows
# Docs: https://fly.io/docs/launch/github-actions/
# Docs: https://render.com/docs/deploy-hooks

name: Deploy demo

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (fly|render|both)"
        required: true
        default: both
        type: choice
        options:
          - fly
          - render
          - both

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  # Cancel an in-flight deploy if a newer tag arrives.  The most recent tag
  # is always the canonical demo state.
  group: deploy-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — Build + smoke-test the demo image locally on the runner.
  # Catches Dockerfile.demo regressions BEFORE pushing to Fly / Render.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build + smoke-test demo image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.demo
          tags: nucleus-demo:ci
          # Don't push — this stage only smoke-tests the build.
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image (health endpoint must return 200)
        run: |
          docker run --rm -d \
            --name nucleus-demo-smoke \
            -p 8080:8080 \
            -e NUCLEUS_DEMO_MODE=true \
            nucleus-demo:ci
          # Allow up to 60 s for Workbench to bind + initial Iceberg load.
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /dev/null; then
              echo "Smoke test passed (after ${i} retries)."
              docker logs nucleus-demo-smoke || true
              docker stop nucleus-demo-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test FAILED — /api/health did not return 200 within 60 s."
          docker logs nucleus-demo-smoke || true
          docker stop nucleus-demo-smoke
          exit 1

  # ---------------------------------------------------------------------------
  # Stage 2a — Deploy to Fly.io (the recommended host).
  # Only runs if FLY_API_TOKEN secret is set in repo settings.
  # ---------------------------------------------------------------------------
  deploy-fly:
    name: Deploy to Fly.io
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip silently when the secret isn't configured (founder hasn't opted in).
    if: >-
      (github.event_name == 'push'
        || github.event.inputs.target == 'fly'
        || github.event.inputs.target == 'both')

    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify FLY_API_TOKEN is set
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "Skipping Fly deploy — FLY_API_TOKEN secret not set."
            exit 0
          fi
          echo "FLY_API_TOKEN present; proceeding."

      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config deploy/fly.toml \
            --dockerfile deploy/Dockerfile.demo \
            --remote-only \
            --strategy rolling

      - name: Post-deploy health check
        if: env.FLY_API_TOKEN != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent https://nucleus-demo.fly.dev/api/health > /dev/null; then
              echo "Post-deploy health check passed (after ${i} retries)."
              exit 0
            fi
            sleep 4
          done
          echo "Post-deploy health check FAILED."
          exit 1

  # ---------------------------------------------------------------------------
  # Stage 2b — Deploy to Render via deploy hook.
  # Only runs if RENDER_DEPLOY_HOOK_URL is set.
  # ---------------------------------------------------------------------------
  deploy-render:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'push'
        || github.event.inputs.target == 'render'
        || github.event.inputs.target == 'both')

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "Skipping Render deploy — RENDER_DEPLOY_HOOK_URL secret not set."
            exit 0
          fi
          curl --fail --silent -X POST "${RENDER_DEPLOY_HOOK_URL}"
          echo "Render deploy hook triggered."

      # Render's deploy hook returns immediately; build runs async.  We don't
      # poll because Render free tier doesn't expose a free-tier API endpoint
      # for build status.  Founder verifies via the Render dashboard or the
      # Cloudflare uptime probe.

  # ---------------------------------------------------------------------------
  # Stage 3 — Notify on failure (optional; only fires if either deploy fails).
  # ---------------------------------------------------------------------------
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [deploy-fly, deploy-render]
    if: failure()

    steps:
      - name: Print summary
        run: |
          echo "::error::Demo deploy failed for tag ${GITHUB_REF_NAME}."
          echo "Inspect the failed job logs above; rollback procedure is"
          echo "documented at docs/release/public_demo_deploy_plan.md §11."
