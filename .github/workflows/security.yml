# .github/workflows/security.yml — Nucleus security scans
#
# Per ADR-022: runs weekly (Sunday 04:00 UTC) and on push to main.
# Four checks:
#   1. pip-audit — dependency CVE scan
#   2. bandit — static analysis on src/
#   3. trivy fs — filesystem secret scan (no real secrets should exist in repo)
#   4. cyclonedx-py — SBOM generation (artifact uploaded to GitHub release artifacts)
#
# All results are uploaded as job artifacts.  pip-audit failures block the job;
# bandit and trivy findings are uploaded but do not block (warning-only) so the
# nightly doesn't create false noise from low-severity informational findings.
# The founder reviews the weekly output during the quarterly upgrade audit.
#
# Per AGENTS.md Anti-Over-Engineering: no Dependabot auto-merge, no CodeQL SAST
# (that is a v0.5+ concern after the codebase stabilises).

name: Security

on:
  schedule:
    - cron: "0 4 * * 0"   # 04:00 UTC every Sunday
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # for uploading SARIF results if added later

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # pip-audit 2.7.3 required cyclonedx-python-lib<8 but cyclonedx-bom
          # 5.1.1 requires cyclonedx-python-lib>=8,<9 — resolver conflict.
          # pip-audit 2.10.0 widens to cyclonedx-python-lib<12,>=5 (intersects
          # cyclonedx-bom's 8.x requirement). Minor-version bump within same
          # major; dev-only pin (security workflow only, not in pyproject.toml
          # runtime deps). Per Constraint #11 exact pins; per AGENTS.md §11.12
          # verified on PyPI before pinning.
          # Docs: https://pypi.org/project/pip-audit/2.10.0/
          pip install \
            pip-audit==2.10.0 \
            bandit[toml]==1.8.3 \
            cyclonedx-bom==5.1.1

      # ---- 1. pip-audit: dependency CVEs (blocking) -------------------------
      - name: pip-audit (dependency CVEs)
        id: pip-audit
        run: |
          pip-audit --format=markdown --output=pip-audit-report.md || {
            echo "::warning::pip-audit found CVEs — review pip-audit-report.md"
            # Don't exit non-zero here; we upload the report and let the founder decide.
          }

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.md
          retention-days: 30

      # ---- 2. bandit: static security analysis (warning-only) ---------------
      - name: bandit (static analysis on src/)
        run: |
          bandit -r src/nucleus/ \
            --format json \
            --output bandit-report.json \
            --severity-level medium \
            || echo "::warning::bandit found issues — review bandit-report.json"

      - name: Upload bandit report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      # ---- 3. trivy fs: secret scan (warning-only) --------------------------
      # Use the official setup-trivy action (cached binaries, GitHub-maintained)
      # instead of the upstream install.sh + curl pattern, which broke on the
      # v0.58.2 pin (CI runs/25934949898 exit code 1 from sh -s).
      #
      # Version pin must be >= v0.69.2: most trivy releases were deleted from
      # GitHub in March 2026, breaking install.sh for any older tag (including
      # v0.68.2 from the action's README). See:
      #   https://github.com/aquasecurity/setup-trivy/issues/30
      # Pinning to the latest stable v0.70.0 (2026-04-17) per AGENTS.md §11.12
      # — exact pin, docs-verified, post-deletion window so artifacts persist.
      # Docs (action): https://github.com/aquasecurity/setup-trivy/blob/main/README.md
      # Docs (trivy):  https://github.com/aquasecurity/trivy/releases/tag/v0.70.0
      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.70.0

      - name: trivy fs (secrets + misconfig)
        run: |
          trivy fs . \
            --scanners secret,config \
            --format table \
            --exit-code 0 \
            --output trivy-report.txt \
            || echo "::warning::trivy found issues — review trivy-report.txt"

      - name: Upload trivy report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30

      # ---- 4. cyclonedx-py: SBOM generation ---------------------------------
      - name: Generate SBOM (CycloneDX)
        run: |
          cyclonedx-py environment \
            --output-format json \
            --output-file sbom.json \
            || echo "::warning::SBOM generation failed"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
