name: docs-build

# Build-only workflow — deploy is handled by a separate CI/CD workflow.
# This checks that mkdocs build --strict passes with zero warnings.
# Per docs/decisions/ADR-021-mkdocs-material-docs-stack.md (PROPOSED).

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "src/nucleus/**"  # Rebuild when source docstrings change
  pull_request:
    branches: [main]
    paths:
      - "docs/site/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "src/nucleus/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install nucleus + docs extras
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Verify docs extras versions
        run: |
          python -c "
          import importlib.metadata as m
          required = {
            'mkdocs': '1.6.1',
            'mkdocs-material': '9.5.49',
            'mkdocstrings': '0.27.0',
            'mkdocs-include-markdown-plugin': '7.2.2',
            'mkdocs-glightbox': '0.5.2',
            'pymdown-extensions': '10.21.3',
          }
          for pkg, expected in required.items():
            actual = m.version(pkg)
            assert actual == expected, f'{pkg}: expected {expected}, got {actual}'
            print(f'✓ {pkg}=={actual}')
          "

      - name: Build docs (strict — zero warnings)
        run: |
          mkdocs build --strict --site-dir _site_test
        env:
          PYTHONDONTWRITEBYTECODE: 1

      - name: Count pages built
        run: |
          find _site_test -name "*.html" | wc -l

      - name: Upload build artifact (for inspection on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-output
          path: _site_test/
          retention-days: 3

      - name: Clean up test build
        run: rm -rf _site_test
