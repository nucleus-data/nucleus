# .github/workflows/ci.yml — Nucleus full CI matrix
#
# Per ADR-022: expanded from single-OS / single-Python to the full beachhead
# support matrix (Python 3.11 + 3.12 × Ubuntu + macOS + Windows) with five
# distinct jobs.  Jobs are concurrency-cancelled on the same PR to save runner
# minutes.
#
# Anti-Over-Engineering note (founder directive 2026-05-13):
#   - No artifact uploads inside the test job (release.yml handles that)
#   - No Codecov integration yet — coverage XML is uploaded as a job artifact
#   - beachhead-e2e skips Windows because docker-compose in GH Windows runners
#     is unreliable; tracked in docs/decisions/ADR-022-cicd-release-automation.md

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# ---------------------------------------------------------------------------
# Job 1 — Lint (Ruff + mypy strict)
# ---------------------------------------------------------------------------
jobs:
  lint:
    name: Lint (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev extras
        run: uv pip install -e ".[dev]" --system

      - name: Ruff check
        run: ruff check src/nucleus/ctx scripts poc tests --exclude tests/ctx

      - name: Ruff format check
        run: ruff format --check src/ scripts/ poc/ tests/

      - name: mypy strict
        run: mypy src/nucleus/

  # ---------------------------------------------------------------------------
  # Job 2 — Governance (all 8 scripts must EXIT 0)
  # ---------------------------------------------------------------------------
  governance:
    name: Governance (8/8 scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev extras
        run: uv pip install -e ".[dev]" --system

      - name: Vocabulary guard (AGENTS.md §7)
        run: python scripts/check_vocabulary.py

      - name: Pinned dependency check (Constraint #11)
        run: python scripts/check_pinning.py

      - name: LOC budget (Constraint #8)
        run: python scripts/loc_budget.py

      - name: Dagster leak check (v4.1 §6.4)
        run: python scripts/dagster_leak_check.py

      - name: Error code numbering (ADR-006)
        run: python scripts/check_error_codes.py

      - name: API stability tier (ADR-005)
        run: python scripts/check_api_stability.py

      - name: Layer direction guard (engineering.md §3.1)
        run: python scripts/check_layering.py

      - name: License tier check (ADR-007)
        run: python scripts/check_licenses.py

  # ---------------------------------------------------------------------------
  # Job 3 — Test (pytest with coverage)
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev extras
        run: uv pip install -e ".[dev]" --system

      - name: Run pytest (unit + smoke, no integration)
        run: pytest tests/ poc/ -m "not integration and not slow" --no-cov -v

      - name: Run pytest with coverage (ubuntu-3.11 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: pytest tests/ poc/ -m "not integration and not slow" --cov=nucleus --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4 — Upgrade smoke (scripts/upgrade_smoke.py)
  # ---------------------------------------------------------------------------
  upgrade-smoke:
    name: Upgrade smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev extras
        run: uv pip install -e ".[dev]" --system

      - name: Run upgrade smoke tests
        run: python scripts/upgrade_smoke.py

  # ---------------------------------------------------------------------------
  # Job 5 — Beachhead E2E (Linux + macOS only; requires docker)
  # ---------------------------------------------------------------------------
  beachhead-e2e:
    name: Beachhead E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + dev extras
        run: uv pip install -e ".[dev]" --system

      - name: Run beachhead E2E
        run: python scripts/beachhead_e2e.py
