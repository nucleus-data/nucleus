# .github/workflows/governance.yml — Nucleus nightly governance + drift detection
#
# Per ADR-022: runs every day at 06:00 UTC and on manual dispatch.
# Runs all 8 governance scripts plus LOC budget and upgrade smoke.
# If any governance script fails OR the LOC budget exceeds the ceiling,
# the job fails and an issue is opened (or updated) tagged `governance-alert`.
#
# Drift detection pass: invokes scripts/check_vocabulary.py, check_layering.py,
# dagster_leak_check.py, and loc_budget.py and posts results as an issue comment
# if violations are found.  This is script-level only; the AI drift-detection
# prompt in .cursor/rules/nucleus.mdc is a manual 4-week human review cadence.

name: Nightly Governance

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  issues: write

jobs:
  governance:
    name: Full governance sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run all governance scripts
        id: governance
        run: |
          set +e
          FAILED=0
          REPORT="## Nightly Governance — $(date -u +%Y-%m-%d)\n\n"

          run_script() {
            local name="$1"
            local cmd="$2"
            echo "→ $name"
            output=$(eval "$cmd" 2>&1)
            rc=$?
            if [ $rc -ne 0 ]; then
              FAILED=1
              REPORT+="### ❌ $name\n\`\`\`\n$output\n\`\`\`\n\n"
            else
              REPORT+="### ✅ $name\n\n"
            fi
          }

          run_script "Vocabulary guard"       "python scripts/check_vocabulary.py"
          run_script "Pinned deps"            "python scripts/check_pinning.py"
          run_script "LOC budget"             "python scripts/loc_budget.py"
          run_script "Dagster leak"           "python scripts/dagster_leak_check.py"
          run_script "Error codes (ADR-006)"  "python scripts/check_error_codes.py"
          run_script "API stability (ADR-005)" "python scripts/check_api_stability.py"
          run_script "Layer direction"        "python scripts/check_layering.py"
          run_script "License tier (ADR-007)" "python scripts/check_licenses.py"
          run_script "Upgrade smoke"          "python scripts/upgrade_smoke.py"

          # Write report to output (multiline safe)
          {
            echo 'report<<EOF'
            printf "%b" "$REPORT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          exit $FAILED

      - name: Find existing governance-alert issue
        if: failure()
        id: find-issue
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "governance-alert",
            });
            return issues.length > 0 ? issues[0].number : 0;
          result-encoding: string

      - name: Open or update governance-alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.governance.outputs.report }}`;
            const date = new Date().toISOString().slice(0, 10);
            const title = `Governance alert — ${date}`;
            const body = `${report}\n\n_Auto-opened by the nightly governance workflow._`;

            const existing = parseInt('${{ steps.find-issue.outputs.result }}', 10);
            if (existing > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing,
                title,
                body,
              });
              core.info(`Updated issue #${existing}`);
            } else {
              const { data } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["governance-alert", "maintenance"],
              });
              core.info(`Opened issue #${data.number}`);
            }
