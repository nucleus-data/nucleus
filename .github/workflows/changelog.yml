# .github/workflows/changelog.yml — Nucleus PR changelog + compatibility check
#
# Per ADR-022: runs on every PR to main.
# Two status checks:
#   1. Every PR (except chore: / docs: / skip-changelog-labelled PRs) must
#      update CHANGELOG.md [Unreleased] section.
#   2. Any PR that touches pyproject.toml (dep change) must also update
#      docs/internal/compatibility.md.
#
# These are STATUS CHECKS, not auto-fixes.  They appear on the PR checks panel.
# A PR with [skip-changelog] label passes both checks unconditionally.

name: Changelog check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changelog-check:
    name: CHANGELOG.md updated
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          # Need the base branch to compute diff
          fetch-depth: 0

      - name: Check for [skip-changelog] label or Dependabot author
        id: skip
        run: |
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"
          if [[ "$LABELS" == *"skip-changelog"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=skip-changelog label" >> "$GITHUB_OUTPUT"
          elif [[ "$AUTHOR" == "dependabot[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=dependabot author (per Constraint #11; CHANGELOG updated when founder merges)" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report skip reason
        if: steps.skip.outputs.skip == 'true'
        run: echo "✅ CHANGELOG check skipped — ${{ steps.skip.outputs.reason }}"

      - uses: actions/setup-python@v6
        if: steps.skip.outputs.skip == 'false'
        with:
          python-version: "3.11"

      - name: Run check_changelog.py
        if: steps.skip.outputs.skip == 'false'
        run: |
          python scripts/check_changelog.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --title "${{ github.event.pull_request.title }}"

  compatibility-check:
    name: docs/internal/compatibility.md updated with dep changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Dependabot PRs are exempt — the founder runs the Constraint #11 upgrade
      # workflow (changelog read + smoke test + rollback command + compatibility.md
      # row) on merge, not in the bot PR itself.
      - name: Check if author is Dependabot
        id: dependabot
        run: |
          if [[ "${{ github.event.pull_request.user.login }}" == "dependabot[bot]" ]]; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
            echo "✅ Author is Dependabot — compatibility.md check exempt (Constraint #11 enforced on founder merge)"
          else
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if pyproject.toml changed
        id: toml-changed
        if: steps.dependabot.outputs.is_dependabot == 'false'
        run: |
          git diff --name-only "origin/${{ github.event.pull_request.base.ref }}" HEAD \
            | grep -q "^pyproject\.toml$" \
            && echo "changed=true" >> "$GITHUB_OUTPUT" \
            || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Check if compatibility.md was also updated
        if: steps.dependabot.outputs.is_dependabot == 'false' && steps.toml-changed.outputs.changed == 'true'
        run: |
          git diff --name-only "origin/${{ github.event.pull_request.base.ref }}" HEAD \
            | grep -q "^docs/compatibility\.md$" \
            || {
              echo "::error::pyproject.toml changed but docs/internal/compatibility.md was NOT updated."
              echo "Per AGENTS.md §11.13: every dep change requires updating docs/internal/compatibility.md."
              exit 1
            }
          echo "✅ docs/internal/compatibility.md updated alongside pyproject.toml"
